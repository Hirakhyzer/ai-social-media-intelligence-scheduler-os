<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="PostPilot OS AI social media intelligence scheduler banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="20%" r="72%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title{font:800 44px Arial,Helvetica,sans-serif;fill:#f8fafc;letter-spacing:-.6px}
      .sub{font:700 21px Arial,Helvetica,sans-serif;fill:#c4b5fd}
      .body{font:500 15.5px Arial,Helvetica,sans-serif;fill:#dbeafe}
      .chip{font:700 13px Arial,Helvetica,sans-serif;fill:#ecfeff}
      .tiny{font:500 12px Arial,Helvetica,sans-serif;fill:#94a3b8}
      .cardLabel{font:700 14px Arial,Helvetica,sans-serif;fill:#e0e7ff}
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <g opacity="0.14" stroke="#dbeafe" stroke-width="1.1" fill="none">
    <path d="M70 96 C210 46 340 154 500 92 C680 26 826 114 980 148 C1068 168 1128 142 1160 112"/>
    <path d="M70 268 C210 216 340 302 500 252 C684 192 820 248 960 286 C1046 308 1114 282 1164 238"/>
    <path d="M126 72 L286 132 L472 84 L654 176 L850 96 L1068 164"/>
  </g>

  <g transform="translate(72 72)">
    <text class="title" x="0" y="48">PostPilot OS</text>
    <text class="sub" x="0" y="88">AI Social Media Intelligence + Scheduling</text>
    <text class="body" x="0" y="126">Synthetic marketing-operations lab for trend radar, platform fit, safe drafts, calendars, simulated queues, and analytics.</text>

    <g transform="translate(0 166)">
      <rect x="0" y="0" width="112" height="32" rx="16" fill="#2563eb" opacity="0.95"/>
      <text class="chip" x="56" y="21" text-anchor="middle">Trend Radar</text>
      <rect x="130" y="0" width="120" height="32" rx="16" fill="#7c3aed" opacity="0.95"/>
      <text class="chip" x="190" y="21" text-anchor="middle">Content OS</text>
      <rect x="268" y="0" width="126" height="32" rx="16" fill="#0f766e" opacity="0.95"/>
      <text class="chip" x="331" y="21" text-anchor="middle">Brand Guard</text>
      <rect x="412" y="0" width="132" height="32" rx="16" fill="#c026d3" opacity="0.95"/>
      <text class="chip" x="478" y="21" text-anchor="middle">Schedule Queue</text>
    </g>

    <text class="tiny" x="0" y="238">Simulation-only by default — no scraping, spam, fake engagement, impersonation, or real posting without human approval.</text>
  </g>

  <g transform="translate(880 76)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="202" rx="26" fill="#020617" opacity="0.72" stroke="#334155"/>
    <g transform="translate(42 42)">
      <rect x="0" y="0" width="166" height="116" rx="18" fill="#0f172a" stroke="#475569"/>
      <rect x="18" y="18" width="56" height="28" rx="10" fill="#2563eb" opacity="0.92"/>
      <rect x="92" y="18" width="56" height="28" rx="10" fill="#7c3aed" opacity="0.92"/>
      <rect x="18" y="64" width="56" height="28" rx="10" fill="#0f766e" opacity="0.92"/>
      <rect x="92" y="64" width="56" height="28" rx="10" fill="#c026d3" opacity="0.92"/>
      <path d="M74 32 H92 M74 78 H92 M46 46 V64 M120 46 V64" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="46" cy="32" r="5" fill="#bfdbfe"/>
      <circle cx="120" cy="32" r="5" fill="#ddd6fe"/>
      <circle cx="46" cy="78" r="5" fill="#99f6e4"/>
      <circle cx="120" cy="78" r="5" fill="#f5d0fe"/>
    </g>
    <text class="cardLabel" x="125" y="188" text-anchor="middle">Social Intelligence Loop</text>
  </g>
</svg>