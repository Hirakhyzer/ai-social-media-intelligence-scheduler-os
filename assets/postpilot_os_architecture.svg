<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="PostPilot OS architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 z" fill="#4f46e5"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title{font:800 28px Arial,Helvetica,sans-serif;fill:#0f172a}
      .subtitle{font:500 14px Arial,Helvetica,sans-serif;fill:#475569}
      .label{font:700 15px Arial,Helvetica,sans-serif;fill:#0f172a}
      .small{font:500 12.5px Arial,Helvetica,sans-serif;fill:#475569}
      .arrow{stroke:#4f46e5;stroke-width:3;marker-end:url(#arrow);fill:none}
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text class="title" x="50" y="54">PostPilot OS Architecture</text>
  <text class="subtitle" x="50" y="80">A simulation-first operating system for ethical social-media intelligence, scheduling, analytics, and auditability.</text>

  <g filter="url(#shadow)">
    <rect x="50" y="122" width="170" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="78" y="158">Trend Sources</text>
    <text class="small" x="78" y="184">synthetic signals</text>
    <text class="small" x="78" y="202">or approved APIs</text>

    <rect x="260" y="122" width="170" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="288" y="158">Trend Radar</text>
    <text class="small" x="288" y="184">growth, urgency,</text>
    <text class="small" x="288" y="202">saturation score</text>

    <rect x="470" y="122" width="170" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="498" y="158">Platform Fit</text>
    <text class="small" x="498" y="184">LinkedIn, X, Blog,</text>
    <text class="small" x="498" y="202">Newsletter, Shorts</text>

    <rect x="680" y="122" width="170" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="708" y="158">Timing Engine</text>
    <text class="small" x="708" y="184">best time, backup,</text>
    <text class="small" x="708" y="202">confidence score</text>

    <rect x="890" y="122" width="170" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="918" y="158">Draft Queue</text>
    <text class="small" x="918" y="184">human-review</text>
    <text class="small" x="918" y="202">content jobs</text>

    <rect x="155" y="286" width="190" height="96" rx="20" fill="#ffffff"/>
    <text class="label" x="186" y="322">Brand Guard</text>
    <text class="small" x="186" y="348">risk flags, policy,</text>
    <text class="small" x="186" y="366">claim review</text>

    <rect x="405" y="286" width="190" height="96" rx="20" fill="#ffffff"/>
    <text class="label" x="436" y="322">Content Calendar</text>
    <text class="small" x="436" y="348">campaign days,</text>
    <text class="small" x="436" y="366">channels, owners</text>

    <rect x="655" y="286" width="190" height="96" rx="20" fill="#ffffff"/>
    <text class="label" x="686" y="322">Schedule Simulator</text>
    <text class="small" x="686" y="348">no real posting</text>
    <text class="small" x="686" y="366">by default</text>

    <rect x="905" y="286" width="190" height="96" rx="20" fill="#ffffff"/>
    <text class="label" x="936" y="322">Analytics Loop</text>
    <text class="small" x="936" y="348">synthetic outcomes,</text>
    <text class="small" x="936" y="366">A/B test signals</text>
  </g>

  <path class="arrow" d="M220 168 L260 168"/>
  <path class="arrow" d="M430 168 L470 168"/>
  <path class="arrow" d="M640 168 L680 168"/>
  <path class="arrow" d="M850 168 L890 168"/>
  <path class="arrow" d="M975 214 C975 246 250 246 250 286"/>
  <path class="arrow" d="M345 334 L405 334"/>
  <path class="arrow" d="M595 334 L655 334"/>
  <path class="arrow" d="M845 334 L905 334"/>
  <path class="arrow" d="M1000 286 C1000 244 345 244 345 214"/>

  <rect x="88" y="430" width="1024" height="42" rx="21" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="small" x="600" y="456" text-anchor="middle">Default mode: synthetic planning + simulated queue + explicit human approval before any real platform adapter.</text>
</svg>